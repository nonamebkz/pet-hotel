services:
  mariadb:
    image: mariadb:10.11
    container_name: petshop-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-petshop}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - petshop_mariadb_data:/var/lib/mysql
      - ./docker/mariadb.cnf:/etc/mysql/mariadb.conf.d/99-petshop.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petshop-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      # Saat container app start: init DB jika belum ada (lihat scripts/db-init.sh if-needed)
      AUTO_DB_INIT: ${AUTO_DB_INIT:-1}
      AUTO_DB_SEED_DEV: ${AUTO_DB_SEED_DEV:-1}
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  petshop_mariadb_data:
